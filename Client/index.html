<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Plataforma A.H.M.A</title>

    <link
      rel="shortcut icon"
      href="assets/icons/IconTransparente.ico"
      type="image/x-icon"
    />


    <meta
      name="description"
      content="Área de login para administradores e usuários da plataforma de automação da Horta Mello Ayres."
    />
    
    <meta name="robots" content="noindex, nofollow" />

    
    <link rel="stylesheet" href="assets/css/style.min.css">
    <link rel="stylesheet" href="assets/css/animations.min.css">
    <link rel="stylesheet" href="assets/css/pages/login.css" />

    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body class="login-page-body">
    <main class="login-container">
      <section class="login-card">
        <header class="login-header">
          <div class="login-logo-container">
            <img
              src="assets/images/bannerAHMA.webp"
              alt="Logo A.H.M.A"
              class="login-logo"
              fetchpriority="high"
            />
          </div>

          <h1 id="auth-title">Acesso à plataforma</h1>

          <p id="auth-subtitle">Entre para acessar a Plataforma A.H.M.A.</p>
        </header>

        <div class="auth-tabs">
          <button type="button" id="tab-login" class="auth-tab active">
            Entrar
          </button>
          <button type="button" id="tab-cadastro" class="auth-tab">
            Cadastrar
          </button>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <form id="login-form" class="login-form">
          <div class="input-group">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="seu@email.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="input-group">
            <label for="password">Senha</label>
            <div class="password-input">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="6 a 20 caracteres"
                autocomplete="current-password"
                minlength="6"
                maxlength="20"
                required
              />
              <button
                type="button"
                id="toggle-password"
                class="toggle-password"
                aria-label="Mostrar senha"
              >
                👁
              </button>
            </div>
          </div>

          <button type="submit" id="btn-login" class="btn-login-submit">
            Entrar
          </button>

          <p id="error-message" class="error-message" aria-live="polite"></p>
        </form>

        <!-- FORMULÁRIO DE CADASTRO -->
        <form id="register-form" class="login-form" style="display: none">
          <div class="input-group">
            <label for="reg-email">E-mail</label>
            <input
              type="email"
              id="reg-email"
              name="reg-email"
              placeholder="seu@email.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="input-group">
            <label for="reg-password">Senha</label>
            <div class="password-input">
              <input
                type="password"
                id="reg-password"
                name="reg-password"
                placeholder="6 a 20 caracteres"
                autocomplete="new-password"
                minlength="6"
                maxlength="20"
                required
              />
              <button
                type="button"
                id="toggle-reg-password"
                class="toggle-password"
                aria-label="Mostrar senha"
              >
                👁
              </button>
            </div>
            <small
              style="
                display: block;
                margin-top: 4px;
                color: #666;
                font-size: 0.8rem;
              "
            >
              A senha deve conter entre 6 e 20 caracteres e pelo menos 1 número.
            </small>
          </div>

          <button type="submit" id="btn-register" class="btn-login-submit">
            Criar Conta
          </button>

          <p
            id="reg-error-message"
            class="error-message"
            aria-live="polite"
          ></p>
        </form>

        <footer class="login-footer">
          <p>Plataforma A.H.M.A.</p>

          <span> Automatização da Horta Mello Ayres </span>
        </footer>
      </section>
    </main>

    <script type="module" src="src/pages/login.js"></script>
  </body>
</html>
